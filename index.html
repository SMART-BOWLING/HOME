<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СВЕТ ДОМ — статус</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1e33; --fg:#e8ecff; --muted:#8a92b2;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --accent:#3b82f6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--fg); min-height:100vh;
    padding:16px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:720px}
  h1{font-size:20px; margin:0 0 4px; letter-spacing:.3px}
  .sub{color:var(--muted); font-size:12px; margin-bottom:16px}
  .card{
    background:var(--card); border-radius:14px; padding:18px;
    margin-bottom:14px; box-shadow:0 4px 24px rgba(0,0,0,.25);
  }
  .status{display:flex; align-items:center; gap:14px}
  .dot{
    width:18px; height:18px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    box-shadow:0 0 0 0 rgba(0,0,0,.4);
  }
  .dot.ok  {background:var(--ok);  animation:pulse 2s infinite}
  .dot.bad {background:var(--bad); animation:pulse 2s infinite}
  .dot.warn{background:var(--warn)}
  @keyframes pulse{
    0%   {box-shadow:0 0 0 0 currentColor}
    70%  {box-shadow:0 0 0 12px transparent}
    100% {box-shadow:0 0 0 0 transparent}
  }
  .dot.ok  {color:rgba(34,197,94,.5)}
  .dot.bad {color:rgba(239,68,68,.5)}
  .status-text{font-size:22px; font-weight:600}
  .status-sub{font-size:12px; color:var(--muted); margin-top:2px}
  .row{display:flex; justify-content:space-between; padding:6px 0;
       border-bottom:1px solid rgba(255,255,255,.06); font-size:14px}
  .row:last-child{border-bottom:none}
  .row .label{color:var(--muted)}
  .row .val{font-variant-numeric:tabular-nums}
  h2{font-size:14px; text-transform:uppercase; letter-spacing:.6px;
     color:var(--muted); margin:0 0 10px; font-weight:600}
  .timeline{
    position:relative; height:38px; background:#0b0e1c;
    border-radius:8px; overflow:hidden; margin-bottom:6px;
  }
  .tl-bar{
    position:absolute; top:0; bottom:0;
    background:linear-gradient(180deg, rgba(34,197,94,.35), rgba(34,197,94,.15));
  }
  .tl-out{
    position:absolute; top:0; bottom:0;
    background:linear-gradient(180deg, #ef4444, #b91c1c);
    opacity:.85;
  }
  .tl-out.current{
    background:linear-gradient(180deg,#f59e0b,#b45309);
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:.45}}
  .tl-scale{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--muted); margin-top:2px;
  }
  .outage-list{margin-top:10px; font-size:13px}
  .outage-list li{
    padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.06);
    list-style:none; display:flex; justify-content:space-between; gap:10px;
  }
  .outage-list li:last-child{border-bottom:none}
  .outage-list li.current{color:var(--warn); font-weight:600}
  .empty{color:var(--muted); font-size:13px; padding:6px 0}
  .footer{
    text-align:center; color:var(--muted); font-size:11px;
    margin-top:8px;
  }
  .refresh{
    background:none; border:1px solid rgba(255,255,255,.15);
    color:var(--fg); padding:6px 12px; border-radius:8px;
    font-size:12px; cursor:pointer;
  }
  .refresh:hover{background:rgba(255,255,255,.06)}
  .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>💡 СВЕТ ДОМ</h1>
      <div class="sub">ESP32 → Google Sheets → эта страница</div>
    </div>
    <button class="refresh" id="refreshBtn">Обновить</button>
  </div>

  <!-- СТАТУС -->
  <div class="card">
    <div class="status">
      <div class="dot" id="dot"></div>
      <div>
        <div class="status-text" id="statusText">Загрузка…</div>
        <div class="status-sub" id="statusSub">—</div>
      </div>
    </div>
  </div>

  <!-- СЕГОДНЯ -->
  <div class="card">
    <h2>Сегодня</h2>
    <div class="timeline" id="tlToday"></div>
    <div class="tl-scale">
      <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
    </div>
    <ul class="outage-list" id="listToday"></ul>
  </div>

  <!-- ВЧЕРА -->
  <div class="card">
    <h2>Вчера</h2>
    <div class="timeline" id="tlYesterday"></div>
    <div class="tl-scale">
      <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
    </div>
    <ul class="outage-list" id="listYesterday"></ul>
  </div>

  <div class="footer" id="footer">—</div>
</div>

<script>
/* ============ НАСТРОЙКА ============ */
// URL вашего Apps Script (тот же, что и в ESP32)
const API_URL = "https://script.google.com/macros/s/AKfycbxzAgIbRQNPQjp_MqU6Sjpw-2dTK7OUJ9Ypt_w0LGe5lJZlJEksGIOONm4IWy-p7uizHQ/exec";

const REFRESH_MS = 30000;   // автообновление раз в 30 сек
const ONLINE_SEC = 90;      // должно совпадать с Apps Script

/* ============ JSONP ============ */
let jsonpCounter = 0;
function jsonp(url, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cbName = "__jsonp_cb_" + (++jsonpCounter) + "_" + Date.now();
    const script = document.createElement("script");
    let done = false;

    const cleanup = () => {
      if (done) return;
      done = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Таймаут запроса"));
    }, timeoutMs);

    window[cbName] = (data) => {
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      clearTimeout(timer);
      cleanup();
      reject(new Error("Ошибка загрузки JSONP"));
    };

    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "from=web&callback=" + cbName + "&_=" + Date.now();
    document.body.appendChild(script);
  });
}

/* ============ УТИЛИТЫ ============ */
function pad(n){ return String(n).padStart(2,"0"); }

function fmtTime(ms){
  const d = new Date(ms);
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function fmtDateTime(ms){
  const d = new Date(ms);
  return pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear()
       + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function fmtDur(min){
  if (min < 1) return "< 1 мин";
  const m = Math.round(min);
  if (m < 60) return m + " мин";
  const h = Math.floor(m/60), mm = m % 60;
  return h + " ч " + (mm ? mm + " мин" : "");
}

function secAgo(ms){
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + " сек назад";
  const m = Math.floor(s/60);
  if (m < 60) return m + " мин назад";
  const h = Math.floor(m/60);
  if (h < 24) return h + " ч назад";
  return Math.floor(h/24) + " дн назад";
}

/* ============ ОТРИСОВКА ============ */
const $ = (id) => document.getElementById(id);

function renderStatus(data){
  const dot = $("dot");
  const txt = $("statusText");
  const sub = $("statusSub");

  if (!data.hasData || !data.lastConnection){
    dot.className = "dot warn";
    txt.textContent = "Нет данных";
    sub.textContent = "ESP32 ещё не отправлял отметки";
    return;
  }

  const ageSec = (data.now - data.lastConnection) / 1000;
  const online = ageSec <= ONLINE_SEC;

  if (online){
    dot.className = "dot ok";
    txt.textContent = "Свет есть";
    sub.textContent = "Последняя отметка: " + fmtDateTime(data.lastConnection)
                    + " (" + secAgo(data.lastConnection) + ")";
  } else {
    dot.className = "dot bad";
    txt.textContent = "Света нет";
    sub.textContent = "Последняя отметка: " + fmtDateTime(data.lastConnection)
                    + " (" + secAgo(data.lastConnection) + ")";
  }
}

function renderTimeline(container, day, nowMs){
  container.innerHTML = "";

  // ширина дня в мс
  const dayStart = day.dayStart;
  const dayEnd   = day.dayEnd;
  const total    = dayEnd - dayStart;

  // не рисуем будущее (если сегодня)
  const visibleEnd = Math.min(dayEnd, nowMs);

  // фон — зелёная полоса «свет был» до visibleEnd
  if (visibleEnd > dayStart){
    const bar = document.createElement("div");
    bar.className = "tl-bar";
    bar.style.left = "0%";
    bar.style.width = ((visibleEnd - dayStart) / total * 100) + "%";
    container.appendChild(bar);
  }

  // отключения
  const outages = day.outages || [];
  outages.forEach(o => {
    const s = Math.max(o.start, dayStart);
    const e = Math.min(o.end, dayEnd);
    if (e <= s) return;

    const left  = (s - dayStart) / total * 100;
    const width = (e - s) / total * 100;

    const el = document.createElement("div");
    el.className = "tl-out" + (o.current ? " current" : "");
    el.style.left  = left + "%";
    el.style.width = Math.max(width, 0.3) + "%";
    el.title = fmtTime(s) + " – " + fmtTime(e) + "  (" + fmtDur(o.dur) + ")";
    container.appendChild(el);
  });
}

function renderList(container, day, nowMs){
  container.innerHTML = "";
  const outages = (day.outages || []).slice().sort((a,b) => a.start - b.start);

  if (!outages.length){
    const li = document.createElement("div");
    li.className = "empty";
    li.textContent = "Отключений не зафиксировано";
    container.appendChild(li);
    return;
  }

  let totalMin = 0;
  outages.forEach(o => {
    totalMin += o.dur;
    const li = document.createElement("li");
    if (o.current) li.className = "current";

    const left = document.createElement("span");
    left.textContent = fmtTime(o.start) + " – "
                     + (o.current ? "сейчас" : fmtTime(o.end))
                     + (o.current ? " ⚡" : "");

    const right = document.createElement("span");
    right.textContent = fmtDur(o.dur);

    li.appendChild(left);
    li.appendChild(right);
    container.appendChild(li);
  });

  // итог
  const li = document.createElement("li");
  li.style.marginTop = "6px";
  li.style.fontWeight = "600";
  const l = document.createElement("span"); l.textContent = "Всего:";
  const r = document.createElement("span"); r.textContent = fmtDur(totalMin);
  li.appendChild(l); li.appendChild(r);
  container.appendChild(li);
}

function render(data){
  renderStatus(data);
  renderTimeline($("tlToday"),     data.today,     data.now);
  renderTimeline($("tlYesterday"), data.yesterday, data.now);
  renderList($("listToday"),       data.today,     data.now);
  renderList($("listYesterday"),   data.yesterday, data.now);
  $("footer").textContent = "Обновлено: " + fmtDateTime(data.now)
                          + "  •  TZ: " + data.timezone;
}

/* ============ ЗАГРУЗКА ============ */
let loading = false;

async function load(){
  if (loading) return;
  loading = true;

  const btn = $("refreshBtn");
  btn.disabled = true;
  btn.textContent = "…";

  try {
    const data = await jsonp(API_URL);
    if (data && data.error){
      throw new Error(data.error);
    }
    render(data);
  } catch (err){
    console.error(err);
    $("dot").className = "dot warn";
    $("statusText").textContent = "Ошибка связи";
    $("statusSub").textContent = err.message || String(err);
  } finally {
    loading = false;
    btn.disabled = false;
    btn.textContent = "Обновить";
  }
}

// первая загрузка + автообновление
load();
setInterval(load, REFRESH_MS);

// ручное обновление
$("refreshBtn").addEventListener("click", load);

// обновляем строку «N сек назад» каждую секунду — без запроса к API
setInterval(() => {
  const txt = $("statusSub");
  if (!txt || !txt.dataset) return;
  // ничего не делаем — просто перезапросим раз в 30 сек,
  // а здесь можно было бы локально пересчитывать "секунд назад"
}, 1000);
</script>
</body>
</html>
