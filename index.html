<style>
*,
*::before,
*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --light-x: 46px;
  --light-y: 240px;
}

body {
  --bg: #fbfaf6;
  --text: #16181d;
  --muted: #7a7d85;
  --line: #e8e5dc;
  --hair: #eeece5;
  --panel: rgba(255,255,255,.64);
  --panel-edge: #e9e6dd;
  --track: #ffe4a8;
  --off: #1b1e25;
  --ok: #10b981;
  --bad: #e11d48;
  --warn: #f59e0b;
  min-height: 100vh;
  padding: 40px max(16px, calc((100vw - 760px) / 2)) 70px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.45;
  font-variant-numeric: tabular-nums "tnum" 1;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background .6s ease, color .6s ease;
}

body.is-off {
  --bg: #f1f0ee;
  --text: #45454a;
  --muted: #8f8f94;
  --line: #dcdcde;
  --hair: #e4e4e6;
  --panel: rgba(255,255,255,.68);
  --panel-edge: #d9d9db;
  --off: #4a4a4f;
  --ok: #8f8f94;
  --bad: #4a4a4f;
  --warn: #8f8f94;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse 145% 115% at var(--light-x) var(--light-y),
    rgba(255,201,109,.34) 0%, rgba(255,221,158,.16) 26%,
    rgba(255,238,208,.05) 52%, transparent 78%);
  opacity: 0;
  transition: opacity .8s ease;
}
body.is-on::before { opacity: 1; }

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse 130% 110% at var(--light-x) var(--light-y),
    transparent 42%, rgba(80,60,20,.07) 100%);
  opacity: 0;
  transition: opacity .8s ease;
}
body.is-on::after { opacity: 1; }

.wrap { width: 100%; max-width: 760px; margin: 0 auto; position: relative; z-index: 10; }

.card {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 18px;
  padding: 22px 24px;
  margin-bottom: 14px;
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  transition: background .5s ease, border-color .5s ease, box-shadow .5s ease;
}
body.is-on .card { box-shadow: 0 1px 0 rgba(255,255,255,.8) inset; }

.dash-card { position: relative; }

.dash-card > * {
  transition: filter .55s ease, opacity .55s ease;
}

main.is-loading .dash-card > * {
  filter: blur(7px) saturate(.85);
  opacity: .5;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.dash-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 6;
  opacity: 0;
  transition: opacity .4s ease;
  background: linear-gradient(100deg,
    rgba(255,255,255,0) 35%,
    rgba(255,255,255,.55) 50%,
    rgba(255,255,255,0) 65%);
  background-size: 240% 100%;
  animation: dashShimmer 1.9s linear infinite;
}
main.is-loading .dash-card::after { opacity: 1; }

@keyframes dashShimmer {
  0%   { background-position: 165% 0; }
  100% { background-position: -65% 0; }
}

.status-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.status-left {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}

.status-icon { width: 34px; height: 34px; flex: 0 0 34px; position: relative; display: grid; place-items: center; }
.status-icon svg { width: 100%; height: 100%; position: relative; z-index: 2; overflow: visible; }
.status-icon::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow, transparent), transparent 70%);
  opacity: 0;
}
.status.on { --glow: rgba(255,186,74,.60); }
.status.on .status-icon::before { opacity: 1; animation: statusPulse 2.5s ease-out infinite; }
@keyframes statusPulse {
  0% { transform: scale(.55); opacity: .7; }
  100% { transform: scale(1.9); opacity: 0; }
}
.si-glass { fill: rgba(120,118,110,.12); stroke: var(--muted); stroke-width: 1.1; transition: fill .4s ease, stroke .4s ease; }
.si-cap { fill: #9a8558; transition: fill .4s ease; }
.si-filament { stroke: var(--muted); stroke-width: 1.2; transition: stroke .4s ease; }
.status.on .si-glass { fill: rgba(255,210,124,.32); stroke: #e0a94e; }
.status.on .si-cap { fill: #bb8a3d; }
.status.on .si-filament { stroke: #ff9d1f; filter: drop-shadow(0 0 3px rgba(255,170,50,1)); }
.status.on .status-icon svg { filter: drop-shadow(0 0 6px rgba(255,186,74,.95)) drop-shadow(0 0 18px rgba(255,186,74,.55)); }
.status.off .si-glass { fill: rgba(120,125,135,.08); stroke: #8a8d93; }
.status.off .si-cap { fill: #8a8d93; }
.status.off .si-filament { stroke: #6a6d73; }
.status.off .status-icon svg { filter: none; }

.status-title { font-size: 23px; font-weight: 750; letter-spacing: -.6px; line-height: 1.1; }
.status.on .status-title { color: #047857; }
.status.off .status-title { color: #8a8f98; }
body.is-off .status.off .status-title { color: var(--bad); }

.day-switch {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border-radius: 9px;
  background: var(--hair);
  border: 1px solid var(--panel-edge);
  transition: background .4s ease, border-color .4s ease;
  flex: 0 0 auto;
}
.day-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .01em;
  padding: 5px 11px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .25s ease, color .25s ease, box-shadow .25s ease;
  white-space: nowrap;
}
.day-btn:hover { color: var(--text); }
.day-btn.is-active {
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 0 0 1px var(--panel-edge) inset;
}
body.is-off .day-btn.is-active { background: rgba(255,255,255,.85); }

.section-title { margin-bottom: 18px; }
.section-title h2 { font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.timeline-wrap { position: relative; }
.timeline {
  position: relative;
  height: 44px;
  background: var(--track);
  border-radius: 8px;
  overflow: hidden;
  isolation: isolate;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
  transition: background .5s ease, box-shadow .5s ease;
  clip-path: inset(0 round 8px);
  -webkit-clip-path: inset(0 round 8px);
  contain: paint;
}
.seg {
  position: absolute;
  top: 0;
  bottom: 0;
  min-width: 2px;
  max-width: 100%;
  background: #4d515c;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
  cursor: pointer;
  transition: filter .15s ease;
  height: 100%;
}
.seg:hover { filter: brightness(1.25); }

.future-mask {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  pointer-events: none;
  z-index: 4;
  background: rgba(251, 250, 246, 0.62);
  backdrop-filter: saturate(0.35) brightness(1.02);
  -webkit-backdrop-filter: saturate(0.35) brightness(1.02);
  transition: opacity .3s ease;
}
.future-mask::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(-45deg, rgba(120,120,130,0.16) 0 1px, transparent 1px 7px);
  opacity: .9;
}
body.is-off .future-mask { background: rgba(241, 240, 238, 0.66); }
body.is-off .future-mask::after {
  background-image: repeating-linear-gradient(-45deg, rgba(120,120,130,0.14) 0 1px, transparent 1px 7px);
}
.future-mask.no-data::before { display: none; }
.future-mask::before { display: none; }

.ticks { position: relative; height: 19px; margin-top: 9px; }
.tick {
  position: absolute;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--muted);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tick.major { color: var(--text); font-weight: 750; }
.tick.edge-start { transform: translateX(-50%); }
.tick.edge-end   { transform: translateX(-50%); }

.legend { display: flex; flex-wrap: wrap; gap: 17px; margin-top: 18px; color: var(--muted); font-size: 11px; }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 5px; border-radius: 3px; display: inline-block; }
.legend .ok { background: var(--track); }
.legend .off { background: #4d515c; }
.legend .future {
  background: repeating-linear-gradient(-45deg, rgba(120,120,130,.35) 0 1px, transparent 1px 5px), var(--bg);
  box-shadow: inset 0 0 0 1px rgba(120,120,130,.25);
}

.report-card .section-title { margin-bottom: 14px; }

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  background: transparent;
  border-radius: 0;
  overflow: visible;
  margin-top: 0;
  text-align: center;
}
.summary-item {
  background: transparent;
  padding: 4px 2px 2px;
  min-width: 0;
  text-align: center;
}
.summary-value {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -.8px;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.summary-label {
  margin-top: 7px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .01em;
  line-height: 1.3;
}

.history { display: flex; flex-direction: column; }
.history-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  padding: 15px 0;
  border-top: 1px solid var(--hair);
}
.history-row:first-child { border-top: none; padding-top: 0; }
.history-row:last-child { padding-bottom: 0; }
.history-time { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.history-duration { font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.history-row.current .history-duration,
.history-row.current .history-time { color: var(--bad); }
.empty { text-align: center; padding: 20px 0; color: var(--muted); font-size: 13px; }

.light-card { padding: 20px 22px; }

.light-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.light-toggle {
  flex: 0 0 auto;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 1px solid var(--panel-edge);
  background: var(--hair);
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: background .35s ease, border-color .35s ease,

  -webkit-tap-highlight-color: transparent;

  user-select: none;
